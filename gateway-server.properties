server.port=8072
eureka.instance.preferIpAddress=true
client.registerWithEureka=true
client.fetchRegistry=true
client.serviceUrl.defaultZone=http://eurekaserver:8761/eureka/

#        Automatic Routing
#Enables the gateway to create routes based on services registered with service discovery
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

#Keycloak security config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/springboot-microservices-realm






#management.endpoints.web.exposure.include=health,info,gateway
#management.endpoint.gateway.access=read-only
#logging.level.root=INFO
#logging.level.org.springframework.cloud.gateway.route.RouteDefinitionLocator=INFO
#logging.level.org.springframework.cloud.gateway=TRACE

#PROMETHEUS CONFIG
# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus
# Enable Prometheus metrics export
management.metrics.export.prometheus.enabled=true
# Prometheus endpoint path (default is /actuator/prometheus)
management.endpoints.web.base-path=/actuator
# Application name (appears as a metric label)


#OPTIONAL BUT IMPORTANT
# Enable all metrics
management.metrics.enable.all=true

# Add common tags to all metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=dev

# Enable JVM metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true



#ROUTING Product service
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://product-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/product

#ROUTING order service
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://order-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/order


#ROUTING inventory service
spring.cloud.gateway.routes[2].id=inventory-service
spring.cloud.gateway.routes[2].uri=lb://inventory-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/inventory


