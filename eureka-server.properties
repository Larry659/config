server.port=8070
eureka.instance.hostname=localhost
eureka.client.registerWithEureka=false
eureka.client.fetchRegistry=false
eureka.serviceUrl.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/
eureka.server.waitTimeInMsWhenSyncEmpty=5


#Zipkin configuration
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.tracing.propagation.type=w3c
management.tracing.mdc.enabled=true


#PROMETHEUS CONFIG
# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info,prometheus
# Enable Prometheus metrics export
management.metrics.export.prometheus.enabled=true
# Prometheus endpoint path (default is /actuator/prometheus)
management.endpoints.web.base-path=/actuator
# Application name (appears as a metric label)


#OPTIONAL BUT IMPORTANT
# Enable all metrics
management.metrics.enable.all=true

# Add common tags to all metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=dev

# Enable JVM metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
